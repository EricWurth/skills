<!DOCTYPE html>
<html>
<head>
  <title>Greenhouse Job Application</title>
</head>
<body>
  <div id="grnhse_app">
    <form>
      <input type="text" name="first_name" placeholder="First Name" />
      <input type="text" name="last_name" placeholder="Last Name" />
      <input type="email" name="email" placeholder="Email" />
      <input type="tel" name="phone" placeholder="Phone Number" />
      <input type="file" name="resume" />
      <input type="text" name="LinkedIn" placeholder="LinkedIn Profile" />
      <input type="text" name="website" placeholder="Personal Website" />
      <input type="text" name="school" placeholder="School" />
      <input type="text" name="degree" placeholder="Degree" />
      <input type="text" name="field" placeholder="Field of Study" />
    </form>
  </div>
</body>
</html>

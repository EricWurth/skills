<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ResumeBot</title>
  <style>
    body { width: 260px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; margin: 10px; font-size: 13px; color: #222; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    button { width: 100%; padding: 8px; margin-top: 5px; cursor: pointer; }
    button.primary { background: #4a90e2; color: #fff; border: none; border-radius: 4px; font-weight: 600; }
    .status-item { margin-bottom: 4px; }
    .hint { color: #666; font-size: 12px; margin-top: 6px; }
    .section { margin-top: 10px; padding-top: 8px; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>ResumeBot</h1>
  <div class="status-item" id="ats">ATS: </div>
  <div class="status-item" id="scan-status">Last scan: </div>
  <div class="status-item" id="credential-status">1Password: </div>
  <button id="fillBtn" class="primary">Fill this page</button>
  <button id="grantBtn" style="display:none;">Grant access on this site</button>
  <button id="scanBtn">Scan</button>
  <div class="section" id="login-section" style="display:none;">
    <button id="createLoginBtn" style="display:none;">Create login in 1Password</button>
    <button id="fillLoginBtn" style="display:none;">Fill login from 1Password</button>
    <div class="hint" id="login-hint"></div>
  </div>
  <button id="optionsBtn">Options</button>
  <div class="hint">Fills and stops. You click submit.</div>
  <script src="popup.js"></script>
</body>
</html>
